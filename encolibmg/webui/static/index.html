<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EncoLibMG</title>
<link rel="icon" href="brand/favicon.png">
<link rel="preload" href="fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<script>
  // collected for the dev screenshot script and the log; the UI shows its own toasts
  window.__errors = [];
  addEventListener("error", e => window.__errors.push(String(e.message)));
  addEventListener("unhandledrejection", e => window.__errors.push("promise: " + String(e.reason && e.reason.message || e.reason)));
</script>
</head>
<body>
<div class="boot" id="boot"><pixel-mark singing></pixel-mark></div>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
