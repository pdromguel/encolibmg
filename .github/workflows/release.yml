# Builds the Windows installer (Inno Setup).
# - Run by hand (Actions → Release → Run workflow): only builds it, as a downloadable artifact.
# - On a pushed tag v1.2.3: checks the tag matches encolibmg/__init__.py, builds it and publishes the GitHub
#   release with the installer and that version's CHANGELOG section.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path encolibmg/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ("v${{ steps.v.outputs.version }}" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match __version__ ${{ steps.v.outputs.version }}"
          }

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" installer\EncoLibMG.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: EncoLibMG-${{ steps.v.outputs.version }}-Setup
          path: installer/Output/*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_notes.py ${{ steps.v.outputs.version }} > notes.md
          gh release create "${{ github.ref_name }}" installer/Output/*.exe --title "EncoLibMG ${{ steps.v.outputs.version }}" --notes-file notes.md
