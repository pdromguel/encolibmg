# Lint + fast tests + JS tests on every push and pull request.
# Not here: `-m slow` (real Demucs/CREPE models and network) and `-m ui` (opens the real window).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ffmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Python packages (PyTorch for CPU, like instalar.bat without a GPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.* torchaudio==2.8.* --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m pyflakes encolibmg tests scripts

      - name: Translations are up to date
        run: |
          python scripts/i18n_build.py
          git diff --exit-code -- encolibmg/locales

      - name: Tests (Python + JS)
        run: python -m pytest -q
